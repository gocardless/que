services:
  default_db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: que-test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - 5435:5432

  lock_db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: que-test-lock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - 5436:5432
